<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Quick Note Taker</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui;
            padding: 20px;
            background: #f4f4f4;
            max-width: 900px;
            margin: auto;
        }

        textarea {
            width: 100%;
            height: 60vh;
            font-size: 18px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: vertical;
        }

        .toolbar {
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            background: #316357;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #deleteBtn {
            background: #f44336;
        }

        #status {
            margin-top: 15px;
            color: gray;
            font-size: 14px;
        }

    </style>
</head>

<body>

    <h1>📝 Quick Note Taker</h1>

    <textarea
        id="note"
        placeholder="Start typing your note..."
    ></textarea>

    <div class="toolbar">
        <button id="newNote">🆕 New Note</button>
        <button id="openFile">📂 Open File</button>
        <button id="saveAs">💾 Save As</button>
        <button id="save">💾 Save</button>
        <button id="deleteBtn">🗑 Delete All</button>
    </div>

    <p id="status"></p>

    <script src="renderer.js"></script>

</body>

</html>
